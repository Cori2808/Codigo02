<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pura Vida QA · Herramientas para la gestión de pruebas</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   1. VARIABLES Y TEMAS (claro / oscuro / automático)
   ===================================================================== */
:root {
  --bg: #faf7f0;
  --ink: #16161a;
  --mut: #6c6c74;
  --card: #fff;
  --line: #e7e1d3;
  --r: #d7263d;
  --b: #1f4fd8;
  --g: #17935c;
  --y: #ffc928;
  --p: #8e3fbf;
  --ease: cubic-bezier(.2, .9, .3, 1.1);
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme=light]) {
    --bg: #111113;
    --ink: #f4efe4;
    --mut: #9b9ba4;
    --card: #1b1b1f;
    --line: #2c2c33;
  }
}
:root[data-theme=dark] {
  --bg: #111113;
  --ink: #f4efe4;
  --mut: #9b9ba4;
  --card: #1b1b1f;
  --line: #2c2c33;
}

/* =====================================================================
   2. BASE
   ===================================================================== */
html {
  scroll-padding-top: env(safe-area-inset-top, 0px);
  scroll-behavior: smooth;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  color: var(--ink);
  font: 16px/1.55 "Bricolage Grotesque", system-ui, -apple-system, sans-serif;
  background:
    radial-gradient(circle at 10% 6%, color-mix(in srgb, var(--y) 45%, transparent) 0 130px, transparent 131px),
    radial-gradient(circle at 94% 40%, color-mix(in srgb, var(--g) 30%, transparent) 0 110px, transparent 111px),
    radial-gradient(circle at 6% 92%, color-mix(in srgb, var(--r) 25%, transparent) 0 120px, transparent 121px),
    var(--bg);
  background-attachment: fixed;
  overflow-x: hidden;
}
main, footer { position: relative; z-index: 1; }
main {
  max-width: 720px;
  margin: 0 auto;
  padding: 28px 20px 60px;
}
h1 {
  font-size: clamp(2.6rem, 11vw, 4.6rem);
  line-height: 1;
  letter-spacing: -.04em;
  font-weight: 800;
  margin: .25em 0;
  text-shadow: 3px 3px 0 var(--y);
}
h1.lt {
  font-size: clamp(1.8rem, 7vw, 2.4rem);
  text-shadow: 2px 2px 0 var(--y);
  margin: .3em 0 .5em;
}
h1 em {
  display: inline-block;
  font-style: normal;
  color: #fff;
  background: var(--r);
  border: 3px solid var(--ink);
  border-radius: 12px;
  padding: 0 .18em;
  transform: rotate(-3deg);
  text-shadow: none;
}
h2 { font-size: 1.45rem; line-height: 1.25; letter-spacing: -.02em; margin: .6em 0; }
h2.ph { font-size: 1.5rem; margin: .2em 0 .5em; }
h3 { font-size: 1.05rem; margin: 1em 0 .3em; }
p { margin: .6em 0; }
.mut { color: var(--mut); }
.tag {
  display: block;
  font-size: .72rem;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--r);
  font-weight: 600;
}
.card {
  background: var(--card);
  border: 3px solid var(--ink);
  box-shadow: 6px 6px 0 var(--ink);
  border-radius: 20px;
  padding: 22px;
  margin: 18px 0;
}
.dato { background: color-mix(in srgb, var(--y) 30%, var(--card)); }
input {
  width: 100%;
  font: inherit;
  padding: 12px 14px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: var(--bg);
  color: var(--ink);
  margin-top: 8px;
}
ol { padding-left: 1.3em; margin: .6em 0 0; }

/* =====================================================================
   3. BOTONES
   ===================================================================== */
button {
  font: inherit;
  cursor: pointer;
  color: var(--ink);
  background: var(--card);
  border: 2.5px solid var(--ink);
  box-shadow: 3px 3px 0 var(--ink);
  border-radius: 14px;
  padding: 13px 16px;
  text-align: left;
  transition: transform .15s, box-shadow .15s, background .2s, opacity .2s;
}
button:hover:not(:disabled) {
  transform: translate(-2px, -2px);
  box-shadow: 5px 5px 0 var(--ink);
}
button:active:not(:disabled) {
  transform: translate(2px, 2px);
  box-shadow: 1px 1px 0 var(--ink);
}
button:disabled { cursor: default; color: var(--ink); box-shadow: none; }
button:focus-visible, .fc:focus-visible {
  outline: 3px solid var(--b);
  outline-offset: 3px;
}
.go {
  background: var(--r);
  color: #fff;
  font-weight: 600;
  text-align: center;
  margin: 6px 8px 0 0;
}
.go:disabled { opacity: .35; color: #fff; }
.back { padding: 6px 12px; font-size: .85rem; }
.mini {
  padding: 5px 10px;
  font-size: .8rem;
  border-radius: 10px;
  box-shadow: 2px 2px 0 var(--ink);
  margin-top: 8px;
}
.ib {
  padding: 6px 10px;
  font-size: 1.05rem;
  line-height: 1.2;
  border-radius: 12px;
  text-align: center;
  box-shadow: 2px 2px 0 var(--ink);
}
.rowb {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}
.big-go {
  width: 100%;
  margin: 14px 0 0;
  padding: 16px;
  font-size: 1.15rem;
  animation: pulse 1.6s ease-in-out infinite;
}

/* =====================================================================
   4. BARRA SUPERIOR PEGAJOSA, TOASTS Y DECORACIÓN
   ===================================================================== */
.top {
  position: sticky;
  top: 0;
  z-index: 6;
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  -webkit-backdrop-filter: blur(8px);
  backdrop-filter: blur(8px);
  border-bottom: 3px solid var(--ink);
}
.top > div {
  max-width: 720px;
  margin: 0 auto;
  padding: 8px 20px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.ptsv {
  margin-left: auto;
  margin-right: 4px;
  font-weight: 800;
  display: inline-block;
}
.ptsv.bump { animation: bump .5s var(--ease); }
.ts {
  position: fixed;
  left: 0;
  right: 0;
  bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  z-index: 20;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  pointer-events: none;
}
.toast {
  background: var(--ink);
  color: var(--bg);
  font-weight: 600;
  border-radius: 999px;
  padding: 10px 18px;
  border: 3px solid var(--y);
  animation: toast 3.4s var(--ease) both;
}
.flag {
  height: 30px;
  border: 0;
  border-bottom: 3px solid var(--ink);
  background: linear-gradient(180deg, var(--b) 0 16.6%, #fff 0 33.3%, var(--r) 0 66.6%, #fff 0 83.3%, var(--b) 0);
}
.tick {
  background: #16161a;
  color: var(--y);
  overflow: hidden;
  white-space: nowrap;
  font-weight: 800;
  letter-spacing: .1em;
  padding: 7px 0;
  border-bottom: 3px solid var(--ink);
}
.tick span {
  display: inline-block;
  padding-left: 100%;
  animation: mq 38s linear infinite;
}
.fl {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  overflow: hidden;
}
.fl i {
  position: absolute;
  bottom: -70px;
  font-style: normal;
  font-size: 2.2rem;
  opacity: .3;
  animation: up 14s linear infinite;
}
.orbs {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  overflow: hidden;
}
.orb {
  position: absolute;
  border-radius: 50%;
  opacity: .14;
  translate: calc(var(--mx, 0) * var(--k) * 1px) calc(var(--my, 0) * var(--k) * 1px);
  transition: translate .5s ease-out;
}
.o1 { width: 220px; height: 220px; left: -60px; top: 22%; background: var(--b); --k: -60; }
.o2 { width: 160px; height: 160px; right: -40px; top: 58%; background: var(--r); --k: 80; }
.o3 { width: 120px; height: 120px; left: 46%; top: 8%; background: var(--g); --k: 40; }
footer { text-align: center; padding: 0 20px 40px; font-weight: 600; }
footer .wheel { margin: 0 auto 10px; width: 48px; height: 48px; }

/* =====================================================================
   5. TRANSICIONES 3D ENTRE PANTALLAS
   ===================================================================== */
#app.out-f { animation: outF .21s ease-in forwards; }
#app.out-b { animation: outB .21s ease-in forwards; }
#app.in-f  { animation: inF .6s var(--ease) both; }
#app.in-b  { animation: inB .6s var(--ease) both; }
.rs { animation: rise .6s var(--ease) backwards; animation-delay: calc(var(--n, 0) * 60ms); }

/* =====================================================================
   6. INICIO: CUBO 3D, RUEDA DE CARRETA, ZOO Y DATOS
   ===================================================================== */
.hero { display: flex; align-items: center; gap: 16px; }
.cubewrap { flex: none; width: 64px; height: 64px; perspective: 520px; margin: 0 6px 0 4px; }
.cube {
  position: relative;
  width: 64px;
  height: 64px;
  transform-style: preserve-3d;
  animation: cube 14s linear infinite;
}
.cube b {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  font-size: 1.9rem;
  border: 3px solid var(--ink);
  border-radius: 8px;
  background: color-mix(in srgb, var(--c, var(--y)) 55%, var(--card));
}
.cube b:nth-child(1) { transform: translateZ(32px); --c: var(--y); }
.cube b:nth-child(2) { transform: rotateY(90deg) translateZ(32px); --c: var(--g); }
.cube b:nth-child(3) { transform: rotateY(180deg) translateZ(32px); --c: var(--r); }
.cube b:nth-child(4) { transform: rotateY(-90deg) translateZ(32px); --c: var(--b); }
.cube b:nth-child(5) { transform: rotateX(90deg) translateZ(32px); --c: var(--p); }
.cube b:nth-child(6) { transform: rotateX(-90deg) translateZ(32px); --c: var(--y); }
.wheel {
  flex: none;
  width: 64px;
  height: 64px;
  border-radius: 50%;
  border: 4px solid var(--ink);
  background: repeating-conic-gradient(var(--r) 0 15deg, var(--y) 0 30deg, var(--b) 0 45deg, #fff 0 60deg);
  animation: spin 14s linear infinite;
}
.zoo { font-size: 2rem; letter-spacing: .25em; margin: 4px 0 8px; }
.zoo span { display: inline-block; animation: wob 3s ease-in-out infinite; animation-delay: calc(var(--i) * -.4s); }
#dt { transition: opacity .2s; }
.autores { margin: 14px 0 8px; }
.autores .tag { margin-bottom: 8px; }
.aut { display: flex; flex-wrap: wrap; gap: 10px; }
.au {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 14px 6px 6px;
  border: 2.5px solid var(--ink);
  border-radius: 999px;
  background: color-mix(in srgb, var(--c) 28%, var(--card));
  box-shadow: 2px 2px 0 var(--ink);
  font-weight: 600;
  font-size: .92rem;
  line-height: 1.2;
  animation: pop .5s var(--ease) backwards;
  animation-delay: calc(var(--i) * 120ms + .4s);
}
.au i {
  flex: none;
  width: 32px;
  height: 32px;
  display: grid;
  place-items: center;
  border: 2px solid var(--ink);
  border-radius: 50%;
  background: var(--c);
  color: #fff;
  font-style: normal;
  font-weight: 800;
  font-size: .8rem;
  letter-spacing: .02em;
}
.badges { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
.bd {
  width: 84px;
  text-align: center;
  padding: 8px 4px;
  border: 2.5px dashed var(--line);
  border-radius: 14px;
  opacity: .55;
  filter: grayscale(1);
}
.bd span { display: block; font-size: 1.7rem; line-height: 1.2; }
.bd small { display: block; font-size: .68rem; line-height: 1.2; }
.bd.on {
  opacity: 1;
  filter: none;
  border: 2.5px solid var(--ink);
  background: color-mix(in srgb, var(--y) 35%, var(--card));
  animation: bdIn .7s var(--ease) backwards;
}

/* =====================================================================
   7. MAPA DE NIVELES (botones con inclinación 3D)
   ===================================================================== */
.grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 10px;
  perspective: 900px;
  margin: 18px 0;
}
.lv {
  min-height: 78px;
  padding: 8px 2px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  font-weight: 800;
  font-size: 1.1rem;
  background: color-mix(in srgb, var(--c, var(--y)) 38%, var(--card));
  animation: lvIn .7s var(--ease) backwards;
  animation-delay: calc(var(--i) * 45ms + .2s);
}
.lv:disabled { opacity: .4; cursor: not-allowed; background: var(--card); }
.lv:nth-child(5n+1) { --c: var(--b); }
.lv:nth-child(5n+2) { --c: var(--r); }
.lv:nth-child(5n+3) { --c: var(--y); }
.lv:nth-child(5n+4) { --c: var(--g); }
.lv:nth-child(5n)   { --c: var(--p); }
.lv small { font-size: .7rem; font-weight: 400; color: var(--r); min-height: 1em; }
.ic { font-size: 1.7rem; line-height: 1.1; }
.lv .ic { transform: translateZ(22px); }
.tilt {
  transform: perspective(700px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg));
  transform-style: preserve-3d;
  transition: transform .15s ease-out, box-shadow .15s;
}
.tilt:hover:not(:disabled) {
  transform: perspective(700px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)) translateZ(14px);
}

/* =====================================================================
   8. VISOR DE TEORÍA: PÁGINAS QUE SE VOLTEAN EN 3D
   ===================================================================== */
.dots { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 10px; }
.dot {
  width: 16px;
  height: 16px;
  padding: 0;
  border-radius: 50%;
  border-width: 2px;
  box-shadow: none;
  background: var(--card);
}
.dot:hover:not(:disabled) { box-shadow: none; transform: scale(1.2); }
.dot.seen { background: var(--g); }
.dot.on { background: var(--r); transform: scale(1.3); }
.book { perspective: 1400px; margin: 14px 0; scroll-margin-top: 64px; }
.page {
  background: var(--card);
  border: 3px solid var(--ink);
  box-shadow: 6px 6px 0 var(--ink);
  border-radius: 20px;
  padding: 22px;
  min-height: 300px;
  backface-visibility: hidden;
}
.page.turn-f { animation: turnF .7s var(--ease) both; transform-origin: left center; }
.page.turn-b { animation: turnB .7s var(--ease) both; transform-origin: right center; }
.page > * { animation: fadeUp .55s var(--ease) backwards; }
.page > *:nth-child(2) { animation-delay: .08s; }
.page > *:nth-child(3) { animation-delay: .16s; }
.page > *:nth-child(4) { animation-delay: .24s; }
.page > *:nth-child(5) { animation-delay: .32s; }
.page > *:nth-child(6) { animation-delay: .40s; }
.page > *:nth-child(7) { animation-delay: .48s; }
.page > *:nth-child(8) { animation-delay: .56s; }
.page > *:nth-child(9) { animation-delay: .64s; }
.page > *:nth-child(10) { animation-delay: .72s; }
.pn { display: flex; gap: 10px; margin-top: 14px; }
.pn .go { flex: 1; margin: 0; }
.bigw { perspective: 600px; text-align: center; margin: 6px 0; }
.bigic { display: inline-block; font-size: 4.6rem; line-height: 1; animation: spin3d 6s ease-in-out infinite; }
.pts-l, ul.pts { list-style: none; padding: 0; margin: 12px 0; }
ul.pts li {
  position: relative;
  padding: 6px 0 6px 30px;
  animation: slideIn .5s var(--ease) backwards;
  animation-delay: calc(var(--i, 0) * 90ms + .25s);
}
ul.pts li::before { content: "✦"; position: absolute; left: 4px; color: var(--r); font-weight: 800; }
.tip, .ej {
  border: 2.5px dashed var(--ink);
  border-radius: 14px;
  padding: 12px 14px;
  margin: 14px 0 4px;
  font-size: .95rem;
}
.tip { background: color-mix(in srgb, var(--y) 30%, var(--card)); }
.ej { background: color-mix(in srgb, var(--b) 14%, var(--card)); }
pre.code {
  background: #16161a;
  color: var(--y);
  border-radius: 14px;
  padding: 14px;
  overflow-x: auto;
  font: .85rem/1.5 ui-monospace, Menlo, Consolas, monospace;
  border: 3px solid var(--ink);
}
.flow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 14px 0; }
.flow .st {
  padding: 6px 12px;
  border: 2.5px solid var(--ink);
  border-radius: 999px;
  background: color-mix(in srgb, var(--g) 28%, var(--card));
  font-weight: 600;
  font-size: .9rem;
  box-shadow: 2px 2px 0 var(--ink);
  animation: pop .5s var(--ease) backwards;
  animation-delay: calc(var(--i) * 140ms + .3s);
}
.flow .ar { color: var(--r); font-weight: 800; animation: pop .5s backwards; animation-delay: calc(var(--i) * 140ms + .4s); }
.tb {
  overflow-x: auto;
  margin: 14px 0;
  border: 3px solid var(--ink);
  border-radius: 14px;
  box-shadow: 4px 4px 0 var(--ink);
  background: var(--card);
}
.tb table { border-collapse: collapse; width: 100%; font-size: .88rem; min-width: 420px; }
.tb th { background: var(--ink); color: var(--bg); text-align: left; padding: 9px 12px; white-space: nowrap; }
.tb td { padding: 9px 12px; border-top: 1px solid var(--line); vertical-align: top; }
.tb tbody tr:nth-child(even) { background: color-mix(in srgb, var(--y) 12%, var(--card)); }
.tb tbody tr { animation: rowIn .5s var(--ease) backwards; animation-delay: calc(var(--i) * 70ms + .25s); }

/* =====================================================================
   9. TARJETAS GIRATORIAS 3D (glosario y tarjetas clave)
   ===================================================================== */
.fgrid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 14px;
  perspective: 1000px;
  margin: 14px 0;
}
.fc {
  height: 190px;
  perspective: 900px;
  cursor: pointer;
  animation: fcIn .7s var(--ease) backwards;
  animation-delay: calc(min(var(--i, 0), 12) * 60ms);
}
.fi {
  position: relative;
  width: 100%;
  height: 100%;
  transform-style: preserve-3d;
  transition: transform .75s cubic-bezier(.2, .8, .2, 1);
}
.fc:hover .fi { transform: rotateY(8deg) rotateX(-4deg); }
.fc.on .fi { transform: rotateY(180deg); }
.fc.on:hover .fi { transform: rotateY(172deg) rotateX(-4deg); }
.ff {
  position: absolute;
  inset: 0;
  -webkit-backface-visibility: hidden;
  backface-visibility: hidden;
  border: 3px solid var(--ink);
  border-radius: 16px;
  box-shadow: 4px 4px 0 var(--ink);
  padding: 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  overflow: auto;
}
.f-front { background: color-mix(in srgb, var(--c, var(--y)) 35%, var(--card)); gap: 4px; }
.f-front b { font-size: 1rem; line-height: 1.2; }
.f-front small { color: var(--mut); font-size: .7rem; }
.f-back { transform: rotateY(180deg); background: var(--card); font-size: .82rem; line-height: 1.4; }
.f-back p { margin: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 4px; }
.chip { padding: 6px 10px; font-size: .85rem; border-radius: 999px; box-shadow: 2px 2px 0 var(--ink); }
.chip.on { background: var(--y); color: #16161a; }

/* =====================================================================
   10. ESCENAS (diálogos) Y PREGUNTAS
   ===================================================================== */
.ln { display: flex; gap: 10px; margin: 12px 0; align-items: flex-start; }
.ln.r { flex-direction: row-reverse; }
.av {
  font-size: 2rem;
  width: 52px;
  height: 52px;
  flex: none;
  border-radius: 50%;
  background: var(--y);
  border: 2.5px solid var(--ink);
  display: grid;
  place-items: center;
}
.ln.r .av { background: var(--g); }
.bu {
  background: var(--card);
  border: 2.5px solid var(--ink);
  box-shadow: 3px 3px 0 var(--ink);
  border-radius: 14px;
  padding: 9px 13px;
  font-size: .95rem;
}
.bu b {
  display: block;
  font-size: .68rem;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--mut);
}
.play { border-top: 1px dashed var(--line); margin-top: 18px; padding-top: 14px; }
.opts { display: grid; gap: 10px; margin: 16px 0; }
.opts .op {
  animation: opIn .55s var(--ease) backwards;
  animation-delay: calc(var(--i, 0) * 70ms + .12s);
}
.opts .ok {
  background: color-mix(in srgb, var(--g) 18%, var(--card));
  border-color: var(--g);
  animation: okpop .55s var(--ease);
}
.opts .bad {
  background: color-mix(in srgb, var(--r) 16%, var(--card));
  border-color: var(--r);
  animation: shake .5s;
}
.opts .gone { opacity: .25; text-decoration: line-through; }
.bar { display: flex; gap: 6px; margin-bottom: 18px; }

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
const norm = s => String(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
const sh = a => { a = [...a]; for (let i = a.length; i > 1;) { const j = Math.random() * i-- | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const rnd = a => a[Math.random() * a.length | 0];
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const COL = ['var(--b)', 'var(--r)', 'var(--y)', 'var(--g)', 'var(--p)'];
const AUTORES = ['Dylan Montoya', 'Coralie Mathieu Vásquez', 'Brandon Membreño', 'Dereck Cerdas'];
const AUCOL = ['var(--b)', 'var(--r)', 'var(--g)', 'var(--p)'];
const iniciales = n => n.split(' ').slice(0, 2).map(w => w[0]).join('').toUpperCase();

/* Sonido opcional (WebAudio, sin archivos externos) */
const SFX = {
  ctx: null,
  beep(f, d = .12, type = 'sine', v = .06) {
    if (!BE.state.sound) return;
    try {
      this.ctx = this.ctx || new (window.AudioContext || window.webkitAudioContext)();
      const o = this.ctx.createOscillator(), g = this.ctx.createGain(), n = this.ctx.currentTime;
      o.type = type;
      o.frequency.value = f;
      g.gain.setValueAtTime(v, n);
      g.gain.exponentialRampToValueAtTime(.0001, n + d);
      o.connect(g);
      g.connect(this.ctx.destination);
      o.start(n);
      o.stop(n + d);
    } catch (e) {}
  },
  ok() { this.beep(660); setTimeout(() => this.beep(880), 90); },
  no() { this.beep(180, .22, 'sawtooth', .04); },
  win() { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => this.beep(f, .18), i * 110)); }
};

/* =====================================================================
   5. BACK-END: sesión, reglas, persistencia y ranking
   ===================================================================== */
const DEF = () => ({ nick: '', best: {}, read: {}, got: [], flags: {}, bestStreak: 0, ans: 0, cor: 0, theme: '', sound: false });
const BE = {
  key: 'pura-vida-qa-v1', state: DEF(), db: null, uid: null,
  load() { try { Object.assign(this.state, JSON.parse(localStorage.getItem(this.key))); } catch (e) {} },
  save() { try { localStorage.setItem(this.key, JSON.stringify(this.state)); } catch (e) {} },
  reset() {
    const { nick, theme, sound } = this.state;
    this.state = Object.assign(DEF(), { nick, theme, sound });
    this.save();
  },
  total() { return Object.entries(this.state.best).reduce((s, [l, n]) => s + n * l, 0); },
  stars(l) { return Math.max(0, (this.state.best[l] || 0) - PASS + 1); },
  unlocked(l) { return l == 1 || (this.state.best[l - 1] || 0) >= PASS; },
  session(l) {
    const qs = sh(LV[l - 1][2].trim().split('\n')).map(r => {
      const [q, ...o] = r.split('|'), x = sh(o);
      return { q, o: x, a: x.indexOf(o[0]) };
    });
    return { l, qs, i: 0, ok: 0, h: [], st: 0, top: 0, hints: 1, rev: [], lock: false, nav: false, on: false };
  },
  record(l, n) {
    const b = this.state.best;
    if (n > (b[l] || 0)) b[l] = n;
    this.state.ans += 7;
    this.state.cor += n;
    this.save();
    this.sync();
  },
  async init() {
    try {
      const c = window.claude;
      if (!c) return;
      this.db = await c.use('db');
      const u = await c.use('user');
      this.uid = u && await u.id();
    } catch (e) { this.db = null; }
  },
  async sync() {
    await this.ready;
    if (!this.db || !this.uid || !this.total()) return;
    try { await this.db.doc('ranking/' + this.uid).set({ nick: this.state.nick || 'Mae anónimo', score: this.total(), t: Date.now() }); } catch (e) {}
  },
  async top() {
    await this.ready;
    if (!this.db) return null;
    try {
      const s = await this.db.collection('ranking').orderBy('score', 'desc').limit(10).get();
      return s.docs.map(d => d.data());
    } catch (e) { return null; }
  }
};
BE.load();
BE.ready = BE.init();

function stagger() {
  [...app.children].forEach((c, i) => { c.classList.add('rs'); c.style.setProperty('--n', i); });
}
function show(render, dir = 1) {
  if (reduce) { render(); stagger(); window.scrollTo(0, 0); return; }
  clearTimeout(busy);
  app.className = 'out-' + (dir > 0 ? 'f' : 'b');
  busy = setTimeout(() => {
    render();
    stagger();
    window.scrollTo(0, 0);
    app.className = 'in-' + (dir > 0 ? 'f' : 'b');
    busy = setTimeout(() => { app.className = ''; }, 700);
  }, 210);
}
function toast(t) {
  const d = document.createElement('div');
  d.className = 'toast';
  d.textContent = t;
  $('#ts').appendChild(d);
  setTimeout(() => d.remove(), 3500);
  SFX.win();
}
function setPts() {
  const el = $('#pts'), t = BE.total();
  if (!el || el.dataset.v == String(t)) return;
  el.dataset.v = t;
  el.textContent = '⭐ ' + t;
  el.classList.remove('bump');
  void el.offsetWidth;
  el.classList.add('bump');
}
function checkBadges() {
  const s = BE.state;
  BADGES.forEach(b => {
    if (b[3](s) && !s.got.includes(b[1])) {
      s.got.push(b[1]);
      BE.save();
      toast(b[0] + ' ¡Insignia desbloqueada: ' + b[1] + '!');
    }
  });
}
function countUp(el, to, ms = 900) {
  if (!el) return;
  if (reduce || !to) { el.textContent = to; return; }
  const t0 = performance.now();
  (function f(t) {
    const p = Math.min(1, (t - t0) / ms);
    el.textContent = Math.round(to * (1 - Math.pow(1 - p, 3)));
    if (p < 1 && el.isConnected) requestAnimationFrame(f);
  })(t0);
}
function boom(n = 24) {
  if (reduce) return;
  for (let k = 0; k < n; k++) {
    const s = document.createElement('i');
    s.className = 'cf';
    s.textContent = rnd(['🇨🇷', '🎉', '☕', '🌺', '🦜', '⭐']);
    s.style.cssText = `left:${Math.random() * 100}vw;animation-delay:${Math.random() * .5}s;--rot:${(Math.random() * 720 - 360) | 0}deg;--dx:${(Math.random() * 160 - 80) | 0}px`;
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 2900);
  }
}

  <div class="grid">${LV.map((L, i) => {
    const l = i + 1, ok = BE.unlocked(l);
    return `<button class="lv tilt" data-l="${l}" data-t="16" style="--i:${i}" title="${esc(L[0])}" ${ok ? '' : 'disabled'}><span class="ic">${ok ? ICO[i] : '🔒'}</span>${l}<small>${'★'.repeat(BE.stars(l)) || (st.read[l] ? '📖' : '')}</small></button>`;
  }).join('')}</div>
  <div class="card"><span class="tag">Tus puntos: ${BE.total()} · Ranking top 10</span><ol id="rk"><li class="mut">Cargando…</li></ol>
    <p class="mut" style="margin:12px 0 0;font-size:.85rem">Precisión: ${pct}% · Mejor racha: ${st.bestStreak}</p>
  </div>
  <button class="mini" id="rs" onclick="askReset()">🗑️ Reiniciar progreso</button>`;
  app.querySelectorAll('.lv').forEach(e => e.onclick = () => theory(+e.dataset.l));
  $('#nick').oninput = e => { st.nick = e.target.value.slice(0, 16); BE.save(); };
  rank();
}
async function rank() {
  const r = await BE.top(), el = $('#rk');
  if (!el) return;
  el.innerHTML = r === null
    ? '<li class="mut">Ranking no disponible aquí; tu progreso se guarda en este dispositivo.</li>'
    : r.length
      ? r.map(x => `<li>${esc(x.nick || 'Mae')} — <b>${+x.score || 0}</b></li>`).join('')
      : '<li class="mut">Nadie todavía. ¡Sea el primero, mae!</li>';
}
function otroDato() {
  const el = $('#dt');
  if (!el) return;
  el.style.opacity = 0;
  setTimeout(() => { el.textContent = rnd(DATOS); el.style.opacity = 1; }, 200);
}
function askReset() {
  const b = $('#rs');
  if (b.dataset.s) { BE.reset(); setPts(); home(); return; }
  b.dataset.s = 1;
  b.textContent = '⚠️ ¿Seguro? Tocá otra vez';
  setTimeout(() => { if (b.isConnected) { delete b.dataset.s; b.textContent = '🗑️ Reiniciar progreso'; } }, 3500);
}

/* =====================================================================
   8. PANTALLA: TEORÍA (visor de páginas con giro 3D)
   ===================================================================== */
const ln = r => {
  const c = CH[r[0]];
  return `<div class="ln${r[0] == 'Y' ? ' r' : ''}"><span class="av" title="${c[1]}">${c[0]}</span><div class="bu"><b>${c[1]}</b>${esc(r.slice(2))}</div></div>`;
};
const flowHTML = a => `<div class="flow">${a.map((s, i) =>
  `<span class="st" style="--i:${i}">${esc(s)}</span>${i < a.length - 1 ? `<span class="ar" style="--i:${i}">➜</span>` : ''}`).join('')}</div>`;
const tblHTML = t => `<div class="tb"><table><thead><tr>${t.h.map(x => `<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${
  t.r.map((r, i) => `<tr style="--i:${i}">${r.map(c => `<td>${md(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
const fc = (g, i) => `<div class="fc" style="--i:${i};--c:${COL[g[0] % 5]}" tabindex="0" role="button" aria-label="Tarjeta: ${esc(g[2])}"><div class="fi">
  <div class="ff f-front"><span class="ic">${g[1]}</span><b>${esc(g[2])}</b><small>Nivel ${g[0]} · tocá para voltear</small></div>
  <div class="ff f-back"><p>${esc(g[3])}</p></div></div></div>`;

function pages(l) {
  return [{ k: 'intro' }, ...TH[l - 1].map(x => ({ k: 'lec', x })), { k: 'cards' }, { k: 'scene' }];
}
function introHTML(l) {
  const L = LV[l - 1], T = TH[l - 1];
  return `<span class="tag">Introducción</span>
  <div class="bigw"><span class="bigic">${ICO[l - 1]}</span></div>
  <p>${esc(L[1])}</p>
  <h3>En esta unidad vas a ver:</h3>
  <ul class="pts">${T.map((x, i) => `<li style="--i:${i}">${x.ic} ${esc(x.t)}</li>`).join('')}
    <li style="--i:${T.length}">🃏 Tarjetas clave para repasar</li>
    <li style="--i:${T.length + 1}">🎭 Una escena tica para practicar</li></ul>
  <div class="tip"><b>💡 Tip</b><br>Usá los botones, las flechas del teclado o deslizá el dedo para pasar de página.</div>`;
}
function lecHTML(x, n, N) {
  return `<span class="tag">Lección ${n} de ${N}</span><h2 class="ph">${x.ic} ${esc(x.t)}</h2>`
    + (x.p || []).map(t => `<p>${md(t)}</p>`).join('')
    + (x.flow ? flowHTML(x.flow) : '')
    + (x.tbl ? tblHTML(x.tbl) : '')
    + (x.pts ? `<ul class="pts">${x.pts.map((t, i) => `<li style="--i:${i}">${md(t)}</li>`).join('')}</ul>` : '')
    + (x.code ? `<pre class="code">${esc(x.code)}</pre>` : '')
    + (x.ej ? `<div class="ej"><b>🧪 Ejemplo</b><br>${md(x.ej)}</div>` : '')
    + (x.tip ? `<div class="tip"><b>💡 Truco tico</b><br>${md(x.tip)}</div>` : '');
}
function cardsHTML(l) {
  const g = G.filter(x => x[0] == l);
  return `<span class="tag">Tarjetas clave</span><h2 class="ph">🃏 Voltealas y repasá</h2>
  <p class="mut">Tocá cada tarjeta para ver su definición. Si te las sabés, ya casi estás listo para la escena.</p>
  <div class="fgrid">${g.map(fc).join('')}</div>`;
}
function sceneInto(l, el) {
  const [t, d, q] = SC[l - 1], O = sh([[q[1], q[2], 1], [q[3], q[4], 0]]);
  el.innerHTML = `<span class="tag">Escena ${l} · ${esc(t)}</span>` + d.split('\n').map(ln).join('')
    + `<div class="play"><b>🎮 ${esc(q[0])}</b><div class="opts">${O.map((o, i) => `<button class="op" style="--i:${i}">${esc(o[0])}</button>`).join('')}</div><div class="rx"></div></div>`;
  const bs = el.querySelectorAll('.opts button');
  bs.forEach((b, k) => b.onclick = () => {
    bs.forEach((x, j) => { x.disabled = true; if (O[j][2]) x.classList.add('ok'); else if (j == k) x.classList.add('bad'); });
    el.querySelector('.rx').innerHTML = ln(O[k][1]);
    if (O[k][2]) { boom(14); SFX.ok(); } else SFX.no();
  });
}
function theory(l, i = 0) { show(() => drawTheory(l, i), 1); }
function drawTheory(l, i = 0) {
  if (S) S.on = false;
  const L = LV[l - 1];
  TP = { l, i, pg: pages(l), seen: new Set([i]) };
  app.innerHTML = `<div class="rowb"><button class="back" onclick="home()">← Mapa</button><button class="mini" style="margin:0" onclick="play(${l})">⏭ Saltar a la práctica</button></div>
  <span class="tag" style="margin-top:20px">Nivel ${l} · Teoría</span>
  <h1 class="lt">${ICO[l - 1]} ${esc(L[0])}</h1>
  <div class="dots" id="dots"></div>
  <div class="book"><div id="pg" class="page"></div></div>
  <div class="pn"><button class="go" id="pp" onclick="turn(-1)">← Anterior</button><button class="go" id="pnx" onclick="turn(1)">Siguiente →</button></div>
  <div id="pgo"></div>`;
  renderPage(1);
}
function renderPage(dir) {
  const { l, i, pg } = TP, p = pg[i], el = $('#pg'), N = pg.filter(x => x.k == 'lec').length, last = i == pg.length - 1;
  el.className = 'page';
  void el.offsetWidth;
  el.classList.add(dir > 0 ? 'turn-f' : 'turn-b');
  if (p.k == 'scene') sceneInto(l, el);
  else el.innerHTML = p.k == 'intro' ? introHTML(l) : p.k == 'lec' ? lecHTML(p.x, i, N) : cardsHTML(l);
  $('#dots').innerHTML = pg.map((_, k) => `<button class="dot ${k == i ? 'on' : TP.seen.has(k) ? 'seen' : ''}" aria-label="Página ${k + 1} de ${pg.length}" onclick="turn(0,${k})"></button>`).join('');
  $('#pp').disabled = i == 0;
  $('#pnx').style.display = last ? 'none' : '';
  $('#pgo').innerHTML = last ? `<button class="go big-go" onclick="play(${l})">¡A la práctica! 🚀</button>` : '';
  if (last) { BE.state.read[l] = 1; BE.save(); checkBadges(); }
}
function turn(d, to) {
  if (!TP) return;
  const j = to == null ? TP.i + d : to;
  if (j < 0 || j >= TP.pg.length || j == TP.i) return;
  const dir = j > TP.i ? 1 : -1;
  TP.i = j;
  TP.seen.add(j);
  renderPage(dir);
  SFX.beep(dir > 0 ? 560 : 420, .05, 'triangle');
  $('.book').scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' });
}

/* =====================================================================
   9. PANTALLA: GLOSARIO (tarjetas 3D con búsqueda y filtro)
   ===================================================================== */
function gloss() {
  BE.state.flags.gloss = 1;
  BE.save();
  show(drawGloss, 1);
  setTimeout(checkBadges, 800);
}
function drawGloss() {
  TP = null;
  if (S) S.on = false;
  app.innerHTML = `<button class="back" onclick="home()">← Mapa</button>
  <span class="tag" style="margin-top:20px">Biblioteca</span>
  <h1 class="lt">📚 Glosario tico</h1>
  <p class="mut">Tocá una tarjeta para voltearla. <b id="gn"></b></p>
  <input id="gq" type="search" placeholder="Buscar término o definición…" value="${esc(GF.q)}" aria-label="Buscar en el glosario">
  <div class="chips" id="gc"></div>
  <div class="fgrid" id="gg"></div>`;
  $('#gq').oninput = e => { GF.q = e.target.value; gridGloss(); };
  chips();
  gridGloss();
}
function chips() {
  $('#gc').innerHTML = ['Todos', ...LV.map((_, i) => ICO[i] + ' ' + (i + 1))]
    .map((t, i) => `<button class="chip ${GF.l == i ? 'on' : ''}" onclick="setL(${i})">${t}</button>`).join('');
}
function setL(i) { GF.l = i; chips(); gridGloss(); }
function gridGloss() {
  const q = norm(GF.q), L = GF.l;
  const r = G.filter(g => (!L || g[0] == L) && (!q || norm(g[2] + ' ' + g[3]).includes(q)));
  $('#gg').innerHTML = r.length ? r.map(fc).join('') : '<p class="mut">Nada por aquí… probá con otra palabra, mae.</p>';
  $('#gn').textContent = r.length + ' de ' + G.length + ' términos';
}

/* =====================================================================
   10. PANTALLA: PRÁCTICA (preguntas con pista y racha)
   ===================================================================== */
function play(l) { show(() => { S = BE.session(l); drawAsk(); }, 1); }
function drawAsk() {
  TP = null;
  S.on = true;
  S.lock = false;
  S.nav = false;
  const x = S.qs[S.i];
  app.innerHTML = `<div class="bar">${S.qs.map((_, k) => `<i class="${k < S.i ? S.h[k] : k == S.i ? 'c' : ''}"></i>`).join('')}</div>
  <div class="qh"><span class="tag">Nivel ${S.l} · Pregunta ${S.i + 1} de 7</span><span class="stk" id="stk">${S.st > 1 ? '🔥 racha ×' + S.st : ''}</span></div>
  <h2 class="q">${esc(x.q)}</h2>
  <div class="opts">${x.o.map((o, k) => `<button class="op" style="--i:${k}" onclick="pick(${k})">${esc(o)}</button>`).join('')}</div>
  <div id="fb"><button class="mini" id="hb" onclick="hint()" ${S.hints ? '' : 'disabled'}>💡 Pista (${S.hints})</button></div>`;
}
function hint() {
  if (!S || !S.hints || S.lock) return;
  S.hints--;
  const x = S.qs[S.i], bs = [...document.querySelectorAll('.opts .op')];
  sh(bs.map((_, k) => k).filter(k => k != x.a)).slice(0, 2).forEach(k => { bs[k].disabled = true; bs[k].classList.add('gone'); });
  const hb = $('#hb');
  hb.disabled = true;
  hb.textContent = '💡 Pista usada';
  SFX.beep(740, .08, 'triangle');
}
function pick(k) {
  if (!S || S.lock) return;
  S.lock = true;
  const x = S.qs[S.i], ok = k == x.a;
  S.h[S.i] = ok ? 'd' : 'x';
  S.ok += ok ? 1 : 0;
  if (ok) {
    S.st++;
    S.top = Math.max(S.top, S.st);
    if (S.top > BE.state.bestStreak) { BE.state.bestStreak = S.top; BE.save(); }
    boom(S.st >= 3 ? 36 : 20);
    SFX.ok();
  } else {
    S.st = 0;
    S.rev.push({ q: x.q, mine: x.o[k], good: x.o[x.a] });
    SFX.no();
    try { navigator.vibrate && navigator.vibrate(60); } catch (e) {}
  }
  document.querySelectorAll('.opts .op').forEach((b, j) => {
    b.disabled = true;
    if (j == x.a) b.classList.add('ok'); else if (j == k) b.classList.add('bad');
  });
  const sk = $('#stk');
  sk.textContent = S.st > 1 ? '🔥 racha ×' + S.st : '';
  if (S.st > 1) { sk.classList.remove('bump'); void sk.offsetWidth; sk.classList.add('bump'); }
  $('#fb').innerHTML = `<p class="fbm"><b>${ok ? '🎉 ' : '🙈 '}${rnd(ok ? YES : NO)}</b>${ok && S.st >= 3 ? ` <span class="hot">🔥 ¡racha de ${S.st}!</span>` : ''}</p>
  <button class="go" onclick="next()">${S.i < 6 ? 'Siguiente →' : 'Ver resultado'}</button>`;
  checkBadges();
}
function next() {
  if (!S || S.nav) return;
  S.nav = true;
  if (S.i < 6) show(() => { S.i++; drawAsk(); }, 1);
  else show(end, 1);
}

/* =====================================================================
   11. PANTALLA: RESULTADO (anillo animado, estrellas y repaso)
   ===================================================================== */
function end() {
  const l = S.l, n = S.ok, pass = n >= PASS;
  S.on = false;
  BE.record(l, n);
  const stars = BE.stars(l);
  app.innerHTML = `<span class="tag">Nivel ${l} · Resultado</span>
  <div class="ringw"><svg class="ring" viewBox="0 0 120 120" aria-hidden="true"><circle class="rb" cx="60" cy="60" r="52"></circle><circle class="rf ${pass ? 'p' : 'f'}" id="rf" cx="60" cy="60" r="52" stroke-dasharray="327" stroke-dashoffset="327"></circle></svg>
    <div class="rn"><span><span id="cnt">0</span>/7</span></div></div>
  <div class="stars">${[1, 2, 3].map(k => `<span class="${k <= stars ? '' : 'off'}" style="--i:${k}">${k <= stars ? '★' : '☆'}</span>`).join('')}</div>
  <p class="center"><b>${pass ? (l == 10 ? '🏆 ¡Terminaste! Sos un crack del QA. ¡Pura vida!' : '¡Tuanis! Nivel superado.') : 'Diay… ocupás al menos 5 de 7. Repasá la teoría y volvé.'}</b></p>
  <p class="mut center">Puntos totales: ${BE.total()} · Mejor racha del nivel: ${S.top}</p>
  ${S.rev.length ? `<div class="card"><span class="tag">Repasá estas (${S.rev.length})</span>${S.rev.map(r => `<div class="rv"><b>${esc(r.q)}</b><div class="mut">Tu respuesta: <s>${esc(r.mine)}</s></div><div>✅ ${esc(r.good)}</div></div>`).join('')}</div>` : '<p class="center">🏅 ¡Cero bichos! Ni una pregunta fallada.</p>'}
  ${pass && l < 10 ? `<button class="go" onclick="theory(${l + 1})">Nivel ${l + 1} →</button>` : ''}
  <button class="go" onclick="theory(${l})">Repasar teoría</button>
  <button class="go" onclick="play(${l})">Reintentar</button>
  <button class="go" onclick="home()">Mapa</button>`;
  setTimeout(() => { const rf = $('#rf'); if (rf) rf.style.strokeDashoffset = 327 * (1 - n / 7); }, 250);
  countUp($('#cnt'), n, 1100);
  if (pass) { boom(40); SFX.win(); }
  setPts();
  checkBadges();
}

/* =====================================================================
   12. INTERACCIONES GLOBALES: tilt 3D, parallax, teclado, gestos, tema
   ===================================================================== */
const tiltOK = !reduce && matchMedia('(hover: hover)').matches;
document.addEventListener('pointermove', e => {
  const r = document.documentElement;
  r.style.setProperty('--mx', (e.clientX / innerWidth - .5).toFixed(3));
  r.style.setProperty('--my', (e.clientY / innerHeight - .5).toFixed(3));
  if (!tiltOK || !e.target.closest) return;
  const t = e.target.closest('.tilt:not(:disabled)');
  if (!t) return;
  const b = t.getBoundingClientRect(), x = (e.clientX - b.left) / b.width - .5, y = (e.clientY - b.top) / b.height - .5, m = +t.dataset.t || 10;
  t.style.setProperty('--ry', (x * m).toFixed(1) + 'deg');
  t.style.setProperty('--rx', (-y * m).toFixed(1) + 'deg');
}, { passive: true });
document.addEventListener('pointerout', e => {
  const t = e.target.closest && e.target.closest('.tilt');
  if (t && !t.contains(e.relatedTarget)) { t.style.removeProperty('--rx'); t.style.removeProperty('--ry'); }
});

/* Tarjetas giratorias: clic o teclado */
app.addEventListener('click', e => {
  const c = e.target.closest('.fc');
  if (!c) return;
  c.classList.toggle('on');
  SFX.beep(c.classList.contains('on') ? 700 : 500, .05, 'triangle');
});
app.addEventListener('keydown', e => {
  if ((e.key == 'Enter' || e.key == ' ') && e.target.classList && e.target.classList.contains('fc')) {
    e.preventDefault();
    e.target.classList.toggle('on');
  }
});

/* Teclado: flechas en la teoría; 1-4 y Enter en la práctica */
document.addEventListener('keydown', e => {
  if (e.target && e.target.tagName == 'INPUT') return;
  if (TP && $('#pg')) {
    if (e.key == 'ArrowRight') turn(1);
    else if (e.key == 'ArrowLeft') turn(-1);
  }
  if (S && S.on) {
    if (!S.lock && ['1', '2', '3', '4'].includes(e.key)) {
      const b = document.querySelectorAll('.opts .op')[+e.key - 1];
      if (b && !b.disabled) b.click();
    } else if (S.lock && e.key == 'Enter') {
      const g = $('#fb .go');
      if (g) g.click();
    }
  }
});

/* Gesto de deslizar para pasar páginas en el celular */
let sx = null;
document.addEventListener('touchstart', e => {
  sx = TP && e.target.closest('.book') && !e.target.closest('.tb, pre') ? e.touches[0].clientX : null;
}, { passive: true });
document.addEventListener('touchend', e => {
  if (sx == null) return;
  const dx = e.changedTouches[0].clientX - sx;
  sx = null;
  if (Math.abs(dx) > 70) turn(dx < 0 ? 1 : -1);
}, { passive: true });

/* Tema claro / oscuro y sonido */
function applyTheme() {
  const t = BE.state.theme, r = document.documentElement;
  if (t) r.dataset.theme = t; else delete r.dataset.theme;
}
function toggleTheme() {
  const st = BE.state, dark = st.theme ? st.theme == 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  st.theme = dark ? 'light' : 'dark';
  BE.save();
  applyTheme();
}
function syncTop() {
  const b = $('#bSn');
  b.textContent = BE.state.sound ? '🔊' : '🔇';
  b.setAttribute('aria-pressed', String(!!BE.state.sound));
}
$('#bHome').onclick = () => home();
$('#bGl').onclick = () => gloss();
$('#bTh').onclick = toggleTheme;
$('#bSn').onclick = () => { BE.state.sound = !BE.state.sound; BE.save(); syncTop(); SFX.ok(); };

/* Emojis flotantes del fondo */
['🦜', '🦥', '🐸', '☕', '🌋', '🌺', '🦋', '🌴', '🥑', '🇨🇷', '🌽'].forEach((e, k) => {
  const i = document.createElement('i');
  i.textContent = e;
  i.style.cssText = `left:${(k * 9 + 4) % 96}%;animation-delay:${-k * 1.7}s;animation-duration:${12 + k % 4 * 3}s`;
  $('.fl').appendChild(i);
});

/* =====================================================================
   13. ARRANQUE
   ===================================================================== */
applyTheme();
syncTop();
setPts();
drawHome();
stagger();
</script>
</body>
</html>
